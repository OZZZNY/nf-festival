<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dream BEGUS</title>

<style>

body{
background:#0a0a0a;
color:#d4af37;
font-family:sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:#111;
padding:20px;
border-radius:20px;
width:90%;
max-width:400px;
border:2px solid #d4af37;
box-sizing:border-box;
}

h1{
text-align:center;
}

input,button{
width:100%;
padding:12px;
margin-top:10px;
box-sizing:border-box;
border:none;
border-radius:10px;
}

input{
background:#222;
color:white;
}

button{
background:#d4af37;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

#result{
text-align:center;
margin-top:20px;
font-size:20px;
}

</style>
</head>

<body>

<div class="box">

<div id="formArea">

<h1>♦ Dream BEGUS ♦</h1>

<input id="name" placeholder="名前">

<input id="keyword" placeholder="あいことば">

<button onclick="reserve()">予約する</button>

</div>

<div id="result"></div>

</div>

<script>

async function reserve(){

const name =
document.getElementById("name").value;

const keyword =
document.getElementById("keyword").value;

const res = await fetch("https://script.google.com/macros/s/AKfycby2GYeUMEk5QVjW3WpctBAjDi2yNshmFFypHePjeGAKtLx401EoUBYLqwjq4F3_xjiE7Q/exec",{

method:"POST",

body:JSON.stringify({
name:name,
keyword:keyword
})

});

const data = await res.json();

document.getElementById("formArea").style.display = "none";

document.getElementById("result").innerHTML = `
<h2>予約完了！</h2>
<p>整理番号：${data.id}</p>
<p>現在待機：${data.waiting}組</p>
`;

}

</script>

</body>
</html>
